# Version catalog for the coach Android app (WebView wrapper + native geofence).
[versions]
agp = "8.13.0"
kotlin = "2.4.0"
coreKtx = "1.16.0"
playServicesLocation = "21.3.0"
webkit = "1.14.0"
junit = "4.13.2"
robolectric = "4.16"
androidxTestCore = "1.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# FusedLocationProviderClient (set-home) + GeofencingClient (the home geofence).
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
# WebViewCompat.addWebMessageListener — the origin-scoped replacement for
# addJavascriptInterface, which is exposed to every frame in the WebView and has
# no origin control at all. See the bridge in MainActivity.
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# A real Android runtime on the JVM, so SharedPreferences (Prefs) and org.json
# (PacingClient) are the implementations the phone runs rather than the android.jar
# stubs, which throw "not mocked" on every call.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
