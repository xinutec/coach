# Robolectric runs the tests against the SDK it has a runtime for, which is not
# the one the app targets: `targetSdk` is 36 and Robolectric 4.16 ships Android
# runtimes up to 35, so left alone it asks its SDK provider for 36 and throws
# UnsupportedOperationException before a single test runs.
#
# 35 is a fine stand-in for what these tests actually exercise — SharedPreferences
# and org.json, neither of which changed in 36. Raise this when Robolectric ships
# a 36 runtime; it is a limit of the test harness, not a statement about the app.
sdk=35
