<mat-form-field appearance="outline" class="search">
  <mat-icon matPrefix>search</mat-icon>
  <mat-label>Search exercises</mat-label>
  <input matInput [ngModel]="search()" (ngModelChange)="search.set($event)" />
</mat-form-field>

<mat-button-toggle-group
  class="filters"
  aria-label="Movement pattern"
  hideSingleSelectionIndicator
  [value]="pattern() ?? ''"
  (change)="pattern.set($event.value || null)"
>
  <mat-button-toggle value="">All</mat-button-toggle>
  @for (p of patterns; track p) {
    <mat-button-toggle [value]="p">{{ capitalise(p) }}</mat-button-toggle>
  }
</mat-button-toggle-group>

@if (loading()) {
  <p class="hint">Loading…</p>
} @else {
  <p class="count">{{ filtered().length }} exercise{{ filtered().length === 1 ? '' : 's' }}</p>
  <div class="grid">
    @for (e of filtered(); track e.id) {
      <button class="card" (click)="open(e)">
        @if (e.imageVersion; as v) {
          <img class="thumb" [src]="imageUrl(e.id, v)" alt="" loading="lazy" />
        } @else {
          <div class="thumb placeholder"><mat-icon>fitness_center</mat-icon></div>
        }
        <div class="body">
          <div class="name">{{ displayName(e) }}</div>
          <div class="chips">
            <span class="pill accent">{{ capitalise(e.pattern) }}</span>
            @if (e.equipment.length === 0) {
              <span class="pill">Bodyweight</span>
            }
            @for (s of e.equipment; track s) {
              <span class="pill">{{ equipLabel(s) }}</span>
            }
          </div>
        </div>
        <mat-icon class="chevron">chevron_right</mat-icon>
      </button>
    }
  </div>
}
